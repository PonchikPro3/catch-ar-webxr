<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#ffedb2">
  <title>Поймай объект</title>
  <style>
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;background:#ffedb2;color:#4b2325;font-family:system-ui,sans-serif;overflow:hidden}
    #unity-container{position:absolute;inset:0}canvas{width:100%;height:100%;display:block;touch-action:none;outline:none}
    #loading,#exit-screen{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#ffedb2;z-index:2}
    .loader{max-width:380px;width:75%;text-align:center}.loader h1{font-size:32px;margin:0 0 20px}.loader p{font-size:15px;line-height:1.6}
    .track{height:14px;background:#ffbf87;margin-top:24px;transform:skewX(-15deg);border:3px solid #ff4545}#progress{height:100%;width:0;background:#ff4545;transition:width .2s}
    #error{display:none;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;line-height:1.5}#exit-screen{display:none}
    @media(prefers-reduced-motion:reduce){#progress{transition:none}}
  </style>
</head>
<body>
  <main id="unity-container">
    <canvas id="unity-canvas" tabindex="0" aria-label="Мини-игра Поймай объект"></canvas>
    <div id="loading"><div class="loader"><h1>Поймай объект</h1><p id="load-label">Загружаем игру…</p><div class="track"><div id="progress"></div></div><p id="error" role="alert"></p></div></div>
    <div id="exit-screen"><div class="loader"><h1>Игра завершена</h1><p>Теперь можно закрыть вкладку.</p></div></div>
  </main>
  <script>
    let unityInstance=null;
    const canvas=document.querySelector('#unity-canvas');
    window.catchARExit=function(){
      document.querySelector('#exit-screen').style.display='flex';
      canvas.style.display='none';
      if(unityInstance) unityInstance.Quit().catch(()=>{});
      window.close();
    };
    function fail(message){
      document.querySelector('#load-label').textContent='Не удалось запустить игру';
      const error=document.querySelector('#error');error.style.display='block';error.textContent=String(message);
      document.querySelector('#loading').style.display='flex';
    }
    const buildUrl='Build';
    const assetVersion='?v=1.6.1';
    const config={
      dataUrl:buildUrl+'/WebGL.data'+assetVersion,
      frameworkUrl:buildUrl+'/WebGL.framework.js'+assetVersion,
      codeUrl:buildUrl+'/WebGL.wasm'+assetVersion,
      streamingAssetsUrl:'StreamingAssets',companyName:'AR Lab',productName:'Catch AR — Поймай объект',productVersion:'1.6.1',
      showBanner:(message,type)=>{if(type==='error')fail(message)},
      autoSyncPersistentDataPath:true,
      devicePixelRatio:Math.min(window.devicePixelRatio||1,1.5)
    };
    
    const script=document.createElement('script');script.src=buildUrl+'/WebGL.loader.js'+assetVersion;
    script.onerror=()=>fail('Не удалось загрузить файлы игры. Обнови страницу.');
    script.onload=()=>createUnityInstance(canvas,config,progress=>{document.querySelector('#progress').style.width=(progress*100)+'%'}).then(instance=>{
      unityInstance=instance;document.querySelector('#loading').style.display='none';canvas.focus();
    }).catch(fail);
    document.body.appendChild(script);
  </script>
</body>
</html>
